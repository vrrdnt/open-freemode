name: Foundation checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested application image to GHCR
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node --test tests/resource.test.mjs
      - run: node --test tests/appearance.test.mjs
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Lua syntax and admission decisions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          find resources -name '*.lua' -print0 | xargs -0 -n1 luac -p
          lua tests/core.test.lua
          lua tests/client.test.lua
      - name: Real disposable MariaDB integration
        run: node scripts/test-database.mjs
      - name: Egg generation stays reproducible
        run: |
          npm run egg
          git diff --exit-code -- pelican/egg-open-freemode.json
      - name: Build pinned Enhanced image
        run: docker build --platform linux/amd64 -t open-freemode:development .
      - name: Native startup through synthetic license rejection
        run: node scripts/test-image.mjs
      - name: Restore matched SQL and files into an isolated deployment
        run: node scripts/test-recovery.mjs

  publication-scan:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    uses: ./.github/workflows/secret-scan.yml

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' && github.repository == 'vrrdnt/open-freemode'
    needs: [verify, publication-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: ghcr-development
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/vrrdnt/open-freemode
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build and test the exact image to publish
        run: |
          docker build --platform linux/amd64 \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t open-freemode:development .
          node scripts/test-image.mjs
          node scripts/test-recovery.mjs
      - name: Ensure the public image does not bundle the Cfx runtime
        run: docker run --rm open-freemode:development test ! -e /opt/open-freemode/runtime
      - name: Publish, verify registry pull, and update development tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tag="$IMAGE:sha-$GITHUB_SHA"
          expected=$(docker image inspect open-freemode:development --format '{{.Id}}')
          docker tag open-freemode:development "$tag"
          docker push "$tag"
          gh api /users/vrrdnt/packages/container/open-freemode --jq '.visibility'
          docker pull "$tag"
          test "$(docker image inspect "$tag" --format '{{.Id}}')" = "$expected"
          digest=$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')
          docker --config "$RUNNER_TEMP/anonymous-registry" pull "$digest"
          docker tag "$tag" "$IMAGE:dev"
          docker push "$IMAGE:dev"
          printf 'Image: `%s`\n\nDigest: `%s`\n\nCfx runtime is downloaded directly on first start.\n' "$tag" "$digest" >> "$GITHUB_STEP_SUMMARY"
          echo "Published image digest: $digest"
      - name: Remove registry login
        if: always()
        run: docker logout ghcr.io
