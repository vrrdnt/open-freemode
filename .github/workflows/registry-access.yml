name: Inspect registry access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'vrrdnt/open-freemode' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Inspect visibility and withdraw the unintended public test version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base = 'https://api.github.com/users/vrrdnt/packages/container/open-freemode'
          def api(url, method='GET'):
              req = urllib.request.Request(url, method=method, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req) as response:
                  data = response.read()
                  return json.loads(data) if data else None
          package = api(base)
          print('Package visibility:', package['visibility'])
          versions = api(base + '/versions')
          print('Version count:', len(versions))
          if package['visibility'] != 'private':
              for version in versions:
                  tags = version['metadata']['container']['tags']
                  if tags == ['sha-2a0f304ef1c55edb7286c3d6644ad6f2e4118706']:
                      api(base if len(versions) == 1 else base + '/versions/' + str(version['id']), 'DELETE')
                      print('Withdrew the initial test version; other versions were not changed.')
          PY
